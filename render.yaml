services:
  # 1. Backend ASP.NET Core Web API
  - type: web
    name: inventra-backend-api
    runtime: docker
    dockerfilePath: backend/MultiTenantInventory.Api/Dockerfile
    dockerContext: backend/MultiTenantInventory.Api
    plan: free
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://0.0.0.0:5000
      - key: PORT
        value: 5000

  # 2. Frontend React Dashboard
  - type: web
    name: inventra-frontend-dashboard
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://inventra-backend-api.onrender.com/api
    headers:
      - path: /*
        name: Cache-Control
        value: max-age=0, no-cache, no-store, must-revalidate
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
